
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
        integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP"
        crossorigin="anonymous">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <title>Nativa | Carrito</title>

</head>

<body>


    <!-- NAVBAR -->
    <header>

        <nav id="navbar">

            <div class="container">

                <h1 class="logo">

                    <a href="index.html">
                        <img src="img/logo1.png" alt="Nativa">
                    </a>

                </h1>


                <ul id="main-nav" class="txt-btn">

                    <li>
                        <a href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="contact.html">
                            Contacto
                        </a>
                    </li>

                    <li>
                        <a class="current" href="carrito.html">

                            <i class="fas fa-shopping-cart"></i>

                            Carrito

                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </header>


    <!-- CARRITO -->
    <section class="carrito-section">

        <div class="container">

            <h1 class="titulo-carrito">
                <i class="fas fa-shopping-cart"></i>
                Mi carrito
            </h1>


            <!-- PRODUCTOS -->
            <div id="carrito-items"></div>


            <!-- RESUMEN -->
            <div class="carrito-resumen">

                <h2>
                    Total:
                    <span id="carrito-total">
                        $0
                    </span>
                </h2>


                <div class="carrito-botones">

                    <a href="index.html"
                        class="btn-carrito">

                        <i class="fas fa-arrow-left"></i>
                        Seguir comprando

                    </a>


                    <button
                        class="btn-comprar"
                        onclick="comprar()">

                        <i class="fas fa-credit-card"></i>
                        Comprar

                    </button>

</div>



                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer id="main-footer">

        <div class="container">

            <p class="small">
                © 2026 Nativa | Diseño con identidad natural
            </p>

            <ul>

                <li>
                    <a href="#" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                </li>

                <li>
                    <a href="#" aria-label="TikTok">
                        <i class="fab fa-tiktok"></i>
                    </a>
                </li>

            </ul>

        </div>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="js/carrito.js"></script>

    <script>
        mostrarCarrito();
    </script>

</body>

</html>
