
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
        integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP"
        crossorigin="anonymous"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link
        rel="stylesheet"
        media="screen and (max-width: 768px)"
        href="css/mobile.css"
    >

    <title>Nativa | Contacto</title>

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <!-- NAVBAR -->
        <nav id="navbar">

            <div class="container">

                <!-- LOGO -->
                <h1 class="logo">

                    <a href="index.html">
                        <img src="img/logo1.png" alt="Nativa">
                    </a>

                </h1>


                <!-- MENÚ -->
                <ul id="main-nav" class="txt-btn">

                    <li>
                        <a href="index.html">
                            Portafolio
                        </a>
                    </li>

                    <li>
                        <a class="current" href="contact.html">
                            Contacto
                        </a>
                    </li>

                </ul>

            </div>

        </nav>


        <!-- BANNER -->
        <div id="showcase">

            <div class="showcase-banner">

                <h1 class="subpage">
                    Contacto
                </h1>

                <p class="large">
                    Ponte en contacto con Nativa
                </p>

            </div>

        </div>

    </header>


    <!-- =========================
         CONTACTO
    ========================== -->

    <section id="contact">

        <div class="container">

            <!-- INFORMACIÓN DE CONTACTO -->
            <div class="contact-features">


                <!-- DIRECCIÓN -->
                <div class="box-contact-features">

                    <i class="fas fa-map-marker-alt fa-2x"></i>

                    <h4>
                        Dirección
                    </h4>

                    <p>
                       Cra. 54 # 68-88, Nte. Centro Historico,Barranquilla, Atlántico
                    </p>

                    <p>
                        Colombia
                    </p>

                </div>


                <!-- TELÉFONO -->
                <div class="box-contact-features">

                    <i class="fas fa-mobile-alt fa-2x"></i>

                    <h4>
                        Teléfono
                    </h4>
                    <p>
                        Soporte: 313 6426090
                    </p>

                </div>


                <!-- EMAIL -->
                <div class="box-contact-features">

                    <i class="fas fa-envelope fa-2x"></i>

                    <h4>
                        Correo electrónico
                    </h4>

                    <p>
                        Soporte: parraalexanderinsecaldas@gmail.com
                    </p>

                </div>

            </div>


            <!-- MAPA + FORMULARIO -->
            <div class="features-contact">


                <!-- MAPA -->
                <div class="box-form">

                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7833.092212234188!2d-74.79793688006734!3d10.997592448877583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sus!4v1789396029168!5m2!1ses!2sus"
                        width="600"
                        height="450"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                    </iframe>

                </div>


                <!-- FORMULARIO -->
                <div class="box-form">

                    <form id="contact-form">


                        <!-- NOMBRE -->
                        <div class="single-form">

                            <label for="name">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Escribe tu nombre"
                                required
                            >

                        </div>


                        <!-- EMAIL -->
                        <div class="single-form">

                            <label for="email">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Escribe tu correo"
                                required
                            >

                        </div>


                        <!-- MENSAJE -->
                        <div class="single-form">

                            <label for="message">
                                Mensaje
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="8"
                                placeholder="Escribe tu mensaje"
                                required
                            ></textarea>

                        </div>


                        <!-- BOTÓN -->
                        <div class="single-form">

                            <button
                                type="submit"
                                class="btn btn-dark"
                            >
                                Enviar mensaje
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </section>


    <!-- SEPARADOR -->
    <hr>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer id="main-footer">

        <div class="container">

            <p class="small">
                © 2026 Nativa | Diseño con identidad natural
            </p>


            <!-- REDES SOCIALES -->
            <ul>

    <li>
        <a href="#" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
    </li>

<li> <a href="#" aria-label="TikTok" class="tiktok-icon"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18" aria-hidden="true"> <path fill="currentColor" d="M448 209.9v125.1c-22.3 2.4-44.9 2.5-67.2-.1-33.8-4-63.8-16.1-89.7-35.9v112.8c0 91.1-73.9 164.9-165 164.9S-39 502.9-39 411.8s73.9-164.9 165-164.9c10.6 0 20.9 1 30.9 2.9v91.4c-9.8-3.2-20.1-4.9-30.9-4.9-41.8 0-75.7 33.9-75.7 75.7s33.9 75.7 75.7 75.7 75.7-33.9 75.7-75.7V0h91.3c.1 8.1.8 16.2 2.1 24.2 5.9 37.5 27.1 69.5 57.8 89.6 25.6 16.8 56.4 26.2 88.1 26.2z"/> </svg> </a> </li>

</ul>


        </div>

    </footer>


</body>
</html>
